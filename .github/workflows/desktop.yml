name: Desktop

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    if: ${{ vars.SAPPHIRUS_NATIVE_LANE_FROZEN != 'true' }}
    runs-on: windows-2025-vs2026
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 11.15.1
          run_install: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # reviewed master 2026-07-16
        with:
          toolchain: 1.97.0
          components: clippy,rustfmt
      - run: pnpm install --frozen-lockfile
      - run: pnpm verify:boundaries
      - run: pnpm secrets:check
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - run: cargo test --workspace --all-features --locked
      # Each trust mode is a distinct build of the product, and --all-features
      # compiles none of them: it compiles all three at once, which is a shape
      # that never ships. Audit item QR-03 asks for the matrix, and it is not
      # theoretical -- when the default feature was removed, three of these
      # four did not compile at all, because nothing had ever built them alone.
      - run: cargo clippy -p desktop-app --all-targets --locked -- -D warnings
        name: clippy (local_only - no model egress compiled)
      - run: cargo clippy -p desktop-app --all-targets --locked --features direct-model-providers -- -D warnings
        name: clippy (development_direct)
      - run: cargo clippy -p desktop-app --all-targets --locked --features deterministic-help -- -D warnings
        name: clippy (deterministic offline Help)
      - run: cargo clippy -p desktop-app --all-targets --locked --features production-support -- -D warnings
        name: clippy (organization_managed)
      - run: cargo test -p desktop-app -p desktop-cloud --locked
        name: test (local_only - the default build)
      - run: pnpm build
      - run: pnpm desktop:build
