name: Internal installer dry run

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-installer:
    if: ${{ vars.SAPPHIRUS_NATIVE_LANE_FROZEN != 'true' }}
    runs-on: windows-2025-vs2026
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.15.1
          run_install: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f
        with:
          toolchain: 1.97.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm verify
      - name: Resolve release metadata
        id: release-metadata
        shell: pwsh
        run: node tools/resolve-release-metadata.mjs --github-output "$env:GITHUB_OUTPUT"
      - run: pnpm desktop:build
      - name: Qualify installer lifecycle
        shell: pwsh
        run: >-
          ./tools/qualify-windows-installer.ps1
          -InstallerPath "target/release/bundle/nsis/${{ steps.release-metadata.outputs.installer_name }}"
          -ExpectedVersion "${{ steps.release-metadata.outputs.product_version }}"
          -InstallRoot "${{ runner.temp }}\\sapphirus-installer-qualification"
          -EvidencePath "${{ runner.temp }}\\sapphirus-installer-qualification.json"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: internal-test-installer
          path: |
            target/release/bundle/nsis/*
            ${{ runner.temp }}/sapphirus-installer-qualification.json
          if-no-files-found: error
