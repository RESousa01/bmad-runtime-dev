# Local runtime/configuration rehearsal for the Container Apps deployment shape.
# Testing only: runs the same image the Azure lane builds, but in the
# ASP.NET Development environment (in-memory adapters, development signing
# and model brokerage). No Entra, SQL, Key Vault, App Configuration, or
# Azure OpenAI dependency is reachable or emulated as a real service; the
# placeholder tenant/client GUIDs below satisfy configuration validation
# only, so every authenticated route fails closed with 401. See README.md.
name: desktop-support-local

services:
  desktop-support-api:
    build:
      # Same build context and Dockerfile as the CI image job.
      context: ../../../services/desktop-support-api
      dockerfile: Dockerfile
    image: ${DESKTOP_SUPPORT_IMAGE:-desktop-support-api:local}
    init: true
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      # Placeholder identifiers in the exact shapes SupportPlaneOptions
      # validates. They are not real Entra objects.
      Sapphirus__Authority: https://login.microsoftonline.com/11111111-1111-1111-1111-111111111111/v2.0
      Sapphirus__Audience: api://22222222-2222-2222-2222-222222222222
      Sapphirus__ApprovedDesktopClientId: 33333333-3333-3333-3333-333333333333
      Sapphirus__Region: local-docker
      Sapphirus__ReleaseChannel: beta
      Sapphirus__DevelopmentSigningEnabled: "true"
      Sapphirus__DevelopmentModelEnabled: "true"
    ports:
      - "127.0.0.1:${FORGE_SUPPORT_PORT:-18080}:8080"
    healthcheck:
      # Development composition has no external dependencies, so readiness is
      # the honest local service gate.
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz/ready"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 15s
    restart: unless-stopped

  production-configuration-contract:
    profiles: ["production-configuration-contract"]
    build:
      context: ../../../services/desktop-support-api
      dockerfile: Dockerfile
    image: ${DESKTOP_SUPPORT_IMAGE:-desktop-support-api:local}
    init: true
    network_mode: none
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      # Shape-valid, non-secret placeholders exercise only startup validation
      # and Production dependency composition. They are not Azure resources.
      Sapphirus__Authority: https://login.microsoftonline.com/11111111-1111-1111-1111-111111111111/v2.0
      Sapphirus__Audience: api://22222222-2222-2222-2222-222222222222
      Sapphirus__ApprovedDesktopClientId: 33333333-3333-3333-3333-333333333333
      Sapphirus__Region: local-production-contract
      Sapphirus__ReleaseChannel: beta
      Sapphirus__ManagedIdentityClientId: 44444444-4444-4444-4444-444444444444
      Sapphirus__AppConfigurationEndpoint: https://forge-contract.azconfig.io/
      Sapphirus__KeyVaultUri: https://forge-contract.vault.azure.net/
      Sapphirus__ReceiptSigningKeyName: forge-contract-signing
      Sapphirus__SqlServer: forge-contract.database.windows.net
      Sapphirus__SqlDatabase: forge_contract
      # Foundry model path, matching the shape main.bicep now injects. The
      # project name below is a PROJECT name; no Foundry deployment name is
      # known to this repository and none is set here.
      Sapphirus__FoundryProjectEndpoint: https://forge-contract.services.ai.azure.com/api/projects/forge-contract
      Sapphirus__FoundryModelIdentityClientId: 55555555-5555-5555-5555-555555555555
      Sapphirus__AllowSharedPilotIdentity: "false"
      Sapphirus__FoundryDeploymentRefreshSeconds: "300"
      Sapphirus__FoundryCatalogMaximumStaleSeconds: "1800"
      Sapphirus__ModelProfileConfigurationPrefix: "desktop-support:model-profile:"
      # Canonical profile pins that main.bicep still injects.
      Sapphirus__ProviderProfileHash: sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
      Sapphirus__ModelProfileHash: sha256:bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb
      Sapphirus__ModelCapabilityHash: sha256:cccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccc
      # Legacy fixed-deployment configuration. main.bicep no longer injects the
      # three values below; they stay here only because the current image's
      # ProductionOptions.Validate still requires them, so removing them would
      # make this rehearsal fail for a reason unrelated to deployment shape.
      # Delete them in the same change that stops the service requiring them.
      Sapphirus__ModelEndpoint: https://forge-contract.openai.azure.com/
      Sapphirus__ModelDeployment: forge-contract-model
      Sapphirus__DeploymentHash: sha256:dddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddd
    healthcheck:
      # Readiness intentionally calls real Azure dependencies and must remain
      # unhealthy here; liveness is enough to prove Production boot/config.
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz/live"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 15s
    restart: unless-stopped
