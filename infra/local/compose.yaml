name: forge-local

services:
  frontend:
    image: ${FORGE_FRONTEND_IMAGE:-forge-frontend:local}
    build:
      context: ../..
      dockerfile: infra/local/frontend.Dockerfile
    init: true
    ports:
      - "127.0.0.1:${FORGE_FRONTEND_PORT:-1420}:1420"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:1420/').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    restart: unless-stopped
    networks:
      - forge-local

  desktop-support-api:
    image: ${DESKTOP_SUPPORT_IMAGE:-forge-desktop-support-api:local}
    build:
      context: ../../services/desktop-support-api
      dockerfile: Dockerfile
    init: true
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      # Shape-valid local placeholders only. The production Azure values stay
      # owned by infra/desktop-support and are deliberately not copied here.
      Sapphirus__Authority: https://login.microsoftonline.com/11111111-1111-1111-1111-111111111111/v2.0
      Sapphirus__Audience: api://22222222-2222-2222-2222-222222222222
      Sapphirus__ApprovedDesktopClientId: 33333333-3333-3333-3333-333333333333
      Sapphirus__Region: local-docker
      Sapphirus__ReleaseChannel: beta
      Sapphirus__DevelopmentSigningEnabled: "true"
      Sapphirus__DevelopmentModelEnabled: "true"
    ports:
      - "127.0.0.1:${FORGE_SUPPORT_PORT:-18080}:8080"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz/ready"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 20s
    restart: unless-stopped
    networks:
      - forge-local

networks:
  forge-local:
    driver: bridge
