[workspace]
members = [
  "crates/desktop-app",
  "crates/desktop-ipc",
  "crates/desktop-runtime",
  "crates/desktop-workspace",
  "crates/desktop-airlock",
  "crates/desktop-egress",
  "crates/desktop-execution",
  "crates/desktop-tools",
  "crates/desktop-store",
  "crates/desktop-cloud",
  "tests/generator-qualification/rust",
  "tests/conformance/rust",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.97.0"
license = "LicenseRef-Proprietary"
authors = ["Sapphirus Engineering"]
publish = false

[workspace.dependencies]
aes-gcm = "=0.11.1"
async-trait = "=0.1.92"
base64 = "=0.23.1"
globset = "=0.4.20"
hex = "=0.4.3"
ignore = "=0.4.33"
jsonschema = "=0.57.0"
parking_lot = "=0.12.5"
rand = "=0.10.3"
reqwest = { version = "=0.13.5", default-features = false, features = ["rustls", "stream"] }
regex = "=1.13.1"
regress = "=0.12.0"
rusqlite = { version = "=0.40.2", features = ["backup", "bundled", "functions"] }
semver = { version = "=1.0.28", features = ["serde"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = { version = "=1.0.151", features = ["preserve_order"] }
sha2 = "=0.11.0"
subtle = "=2.6.1"
tauri = { version = "=2.11.6", default-features = false, features = ["wry"] }
tauri-build = { version = "=2.6.3" }
tauri-plugin-dialog = "=2.7.3"
tauri-plugin-opener = "=2.5.3"
gix = { version = "=0.87.1", default-features = false, features = ["sha1", "status"] }
tauri-plugin-single-instance = "=2.4.5"
tauri-plugin-updater = "=2.12.0"
tauri-plugin-window-state = "=2.4.1"
tempfile = "=3.27.0"
thiserror = "=2.0.21"
time = { version = "=0.3.55", features = ["formatting", "parsing", "serde"] }
tokio = { version = "=1.53.1", features = ["io-util", "macros", "net", "process", "rt-multi-thread", "sync", "time"] }
ulid = { version = "=3.0.0", features = ["serde"] }
unicode-normalization = "=0.1.25"
url = "=2.5.8"
walkdir = "=2.5.0"
windows = { version = "=0.62.2", features = [
  "Win32_Foundation",
  "Win32_Security_Authorization",
  "Win32_Security_Cryptography",
  "Win32_Storage_FileSystem",
  "Win32_System_IO",
  "Win32_System_Memory",
  "Win32_System_Pipes",
  "Win32_System_Threading",
] }
zeroize = { version = "=1.9.0", features = ["derive"] }

[workspace.lints.rust]
unsafe_code = "warn"
unused_must_use = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
# Nursery lints, enabled individually rather than as a group. A lock guard
# created in a `match`/`if let` scrutinee lives until the end of the whole
# expression, so an arm that takes the same lock again parks forever on
# `parking_lot`, which is not reentrant and has no timeout. Three of those
# shipped in the chat lane and none of them was a warning until now.
significant_drop_in_scrutinee = "deny"
