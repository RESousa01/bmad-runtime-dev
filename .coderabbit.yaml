# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json

reviews:
  path_filters:
    # Exclude only the temporary imported vendor snapshots. First-party
    # knowledge tools, docs/current, schemas, compatibility manifests, and
    # future source locks remain inside normal review.
    - "!bmad-runtime-lib/_source_review/BMAD-METHOD-main/**"
    - "!bmad-runtime-lib/_source_review/bmad-builder-main/**"
    - "!bmad-runtime-lib/_source_review/openclaw-main/**"
    - "!bmad-runtime-lib/_source_review/hermes-agent-main/**"
    - "!bmad-runtime-lib/_source_review/odysseus-dev/**"
    - "!bmad-runtime-lib/_full/**"

    # These bindings are reproducibly generated and are covered by the
    # generator qualification and source-drift gates. Review their inputs,
    # generator configuration, and tests instead of thousands of generated files.
    - "!packages/contracts/generated/**"
    - "!tests/generator-qualification/generated/**"

    # Dependency and build products are mechanically verified elsewhere.
    - "!**/node_modules/**"
    - "!**/target/**"
    - "!**/bin/**"
    - "!**/obj/**"
    - "!**/dist/**"
